<section class="tools-section" id="tools" data-sequence="07" aria-labelledby="tools-title">
      <span class="edit-motif edit-motif--tools" aria-hidden="true"><svg><use href="#edit-icon-wave"></use></svg></span>
      <div class="wrap">
        <div class="tools-head">
          <div><div class="eyebrow">Tools &amp; skills</div><h2 class="section-title" id="tools-title">My editing toolkit<span style="color:var(--lime)">.</span></h2></div>
          <p>Self-rated levels shown as a visual guide, not exact percentages.</p>
        </div>
        <div class="tool-grid">
          <article class="tool-card" style="--level:.84;--delay:0ms">
            <div class="tool-card-head"><div class="tool-title"><span class="tool-logo tool-logo--premiere" aria-hidden="true">Pr</span><h3>Premiere Pro</h3></div><span class="tool-level-label">Near-advanced</span></div>
            <div class="tool-meter" aria-hidden="true"><span></span></div>
          </article>
          <article class="tool-card" style="--level:.82;--delay:120ms">
            <div class="tool-card-head"><div class="tool-title"><span class="tool-logo tool-logo--after-effects" aria-hidden="true">Ae</span><h3>After Effects</h3></div><span class="tool-level-label">Near-advanced</span></div>
            <div class="tool-meter" aria-hidden="true"><span></span></div>
          </article>
          <article class="tool-card" style="--level:.32;--delay:240ms">
            <div class="tool-card-head"><div class="tool-title"><span class="tool-logo tool-logo--photoshop" aria-hidden="true">Ps</span><h3>Photoshop</h3></div><span class="tool-level-label">Currently learning</span></div>
            <div class="tool-meter" aria-hidden="true"><span></span></div>
          </article>
          <article class="tool-card" style="--level:.62;--delay:360ms">
            <div class="tool-card-head"><div class="tool-title tool-title--ai"><h3>AI tools</h3><div class="ai-brand-row" role="group" aria-label="AI tools">
              <span class="ai-brand ai-brand--chatgpt" role="img" aria-label="ChatGPT" title="ChatGPT">GPT</span>
              <span class="ai-brand ai-brand--gemini" role="img" aria-label="Gemini" title="Gemini">✦</span>
              <span class="ai-brand ai-brand--claude" role="img" aria-label="Claude" title="Claude">✳</span>
              <span class="ai-brand ai-brand--grok" role="img" aria-label="Grok" title="Grok">x</span>
              <span class="ai-brand ai-brand--copilot" role="img" aria-label="Copilot" title="Copilot">∞</span>
            </div></div><span class="tool-level-label">Familiar</span></div>
            <div class="tool-meter" aria-hidden="true"><span></span></div>
          </article>
        </div>
      </div>
    </section>
